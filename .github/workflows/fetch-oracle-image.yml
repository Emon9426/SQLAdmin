name: fetch-oracle-image

# 一次性工具：在 CI（网络通畅侧）拉取 Oracle Free 镜像并打包为 release 资产，
# 供受限网络环境经 gh-proxy 中继下载后 docker load。用后即删。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-image:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and save
        run: |
          docker pull ghcr.io/gvenzl/oracle-free:23-slim-faststart
          docker save ghcr.io/gvenzl/oracle-free:23-slim-faststart | zstd -T0 -3 -o /tmp/oracle-free.tar.zst
          ls -lh /tmp/oracle-free.tar.zst

      - name: Create or update release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create oracle-image-cache /tmp/oracle-free.tar.zst \
            --title "Oracle Free image cache" \
            --notes "Automated cache of ghcr.io/gvenzl/oracle-free:23-slim-faststart (docker save | zstd). Download then: docker load < oracle-free.tar.zst" \
            --repo "$GITHUB_REPOSITORY" \
          || gh release upload oracle-image-cache /tmp/oracle-free.tar.zst --clobber --repo "$GITHUB_REPOSITORY"
